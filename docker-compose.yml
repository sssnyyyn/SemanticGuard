version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # 로컬 볼륨 마운트는 컨테이너 내부 캐시 파일(cache.faiss 등) 및 logs.json을
    # 호스트 PC와 동기화하여 데이터를 보존하기 위해 활용합니다.
    volumes:
      - ./backend:/app
    # .env 파일에 보관된 GEMINI_API_KEY 및 SMTP 계정 정보 등을 컨테이너 내부에 안전 주입합니다.
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:8000,http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
